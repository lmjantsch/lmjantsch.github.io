name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Tectonic (builds public/cv.pdf from src/cv/)
        run: |
          set -euo pipefail
          url=$(curl -fsSL https://api.github.com/repos/tectonic-typesetting/tectonic/releases/latest \
            | grep -o 'https://[^"]*x86_64-unknown-linux-musl\.tar\.gz' | head -1)
          test -n "$url"
          curl -fsSL "$url" | sudo tar xz -C /usr/local/bin tectonic
          tectonic --version
      - name: Install, build, and upload the site
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
